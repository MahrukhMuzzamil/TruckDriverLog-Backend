# Full stack: PostgreSQL + Redis + Django (gunicorn) + Celery worker/beat
# + React (built, served by nginx) + edge nginx reverse proxy.
#
# Expects the frontend repo cloned as a sibling folder:
#   parent/
#     backend/    <- this repo (run `docker compose up` from here)
#     frontend/   <- TruckDriverLog-Frontend
#
#   docker compose up --build      ->  http://localhost
#
name: truckdriverlog

x-backend-env: &backend-env
  SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
  DEBUG: ${DEBUG:-0}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  DATABASE_URL: postgres://postgres:postgres@db:5432/eldlogs
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eldlogs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eldlogs"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: celery -A config worker --loglevel=info --concurrency=2
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: .
    command: celery -A config beat --loglevel=info
    environment: *backend-env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ../frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
